<!DOCTYPE html>
<html>
<head>
<title>JSS Teachers Support Platform</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

.hero{ padding:30px 20px; }
h1{ color:#22c55e; }

.container{
  max-width:420px;
  margin:auto;
  padding:20px;
}

input, select, button{
  width:100%;
  padding:12px;
  margin:8px 0;
  border:none;
  border-radius:6px;
}

input, select{
  background:#1e293b;
  color:white;
}

button{
  background:#22c55e;
  color:black;
  font-weight:bold;
  cursor:pointer;
}

.hidden{ display:none; }

#status{
  margin-top:15px;
  color:yellow;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="hero">
  <h1>🚀 JSS Teachers Unity Platform</h1>
  <p>Connect • Organize • Advocate • Grow</p>
  <h2 id="teacherCount">👩‍🏫 Loading...</h2>
</div>

<div class="container">

  <div id="step1">
    <input id="tsc" placeholder="Enter TSC Number">
    <button onclick="checkTSC()">Continue</button>
  </div>

  <div id="loginBox" class="hidden">
    <button onclick="goBack()">⬅ Back</button>
    <input id="loginPassword" type="password" placeholder="Enter Password">
    <button onclick="login()">Login</button>
  </div>

  <div id="registerBox" class="hidden">
    <button onclick="goBack()">⬅ Back</button>

    <input id="name" placeholder="Full Name">

    <select id="county" onchange="loadSubCounties()">
      <option value="">Select County</option>
    </select>

    <select id="subcounty">
      <option value="">Select Sub-County</option>
    </select>

    <input id="school" placeholder="School Name">
    <input id="phone" placeholder="Phone (07XXXXXXXX)">
    <input id="password" type="password" placeholder="Create Password">

    <button onclick="registerAndPay()">Register & Pay Ksh 50</button>
  </div>

  <div id="status"></div>
</div>

<script>

/* ================= SAFE GLOBAL ================= */
let currentTSC = "";

/* alias fix for older code mistakes */
const countiesData = {}; // prevents undefined crashes

/* ================= COUNT ================= */
async function loadCount(){
  try{
    const res = await fetch("/count-teachers");
    if(!res.ok) return;

    const data = await res.json();
    document.getElementById("teacherCount").innerText =
      "👩‍🏫 " + (data.total || 0) + " Teachers Registered";
  }catch(e){}
}

setInterval(loadCount, 5000);
loadCount();

/* ================= COUNTIES ================= */
const counties = {
  "Nairobi":["Westlands","Kibra","Kasarani"],
  "Kiambu":["Thika","Ruiru"],
  "Nakuru":["Naivasha","Gilgil"]
};

/* LOAD COUNTIES */
const countySelect = document.getElementById("county");

Object.keys(counties).forEach(c=>{
  const opt = document.createElement("option");
  opt.value = c;
  opt.text = c;
  countySelect.add(opt);
});

/* LOAD SUBCOUNTIES */
function loadSubCounties(){
  const countyEl = document.getElementById("county");
  const sub = document.getElementById("subcounty");

  sub.innerHTML = "<option>Select Sub-County</option>";

  (counties[countyEl.value] || []).forEach(s=>{
    const opt = document.createElement("option");
    opt.text = s;
    sub.add(opt);
  });
}

/* ================= CHECK TSC ================= */
async function checkTSC(){
  const tscInput = document.getElementById("tsc");

  if(!tscInput.value.trim()) return alert("Enter TSC number");

  currentTSC = tscInput.value.trim();

  try{
    const res = await fetch("/check-tsc", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({tsc_no: currentTSC})
    });

    if(!res.ok) throw new Error("Server error");

    const data = await res.json();

    step1.classList.add("hidden");

    if(data.exists){
      loginBox.classList.remove("hidden");
    }else{
      registerBox.classList.remove("hidden");
    }

  }catch(err){
    alert("Server not responding");
  }
}

/* ================= LOGIN ================= */
async function login(){
  try{
    const password = document.getElementById("loginPassword").value;

    const res = await fetch("/login", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        tsc_no: currentTSC,
        password
      })
    });

    const data = await res.json();

    if(data.success){
      localStorage.setItem("teacher", JSON.stringify({
        id: currentTSC,
        name: data.teacher?.name || "Teacher"
      }));

      window.location.href = "/dashboard.html";
    }else{
      alert("Invalid login");
    }

  }catch(e){
    alert("Login failed");
  }
}

/* ================= REGISTER ================= */
async function registerAndPay(){

  const status = document.getElementById("status");

  const body = {
    tsc_no: currentTSC,
    name: document.getElementById("name").value.trim(),
    county: document.getElementById("county").value,
    subcounty: document.getElementById("subcounty").value,
    school: document.getElementById("school").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    password: document.getElementById("password").value.trim()
  };

  if(!body.name || !body.phone || !body.password){
    return alert("Fill all fields");
  }

  try{
    status.innerText = "Saving...";

    const save = await fetch("/save-teacher-temp", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(body)
    });

    if(!save.ok) throw new Error();

    status.innerText = "Sending M-PESA request...";

    await fetch("/pay", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(body)
    });

    status.innerText = "Check your phone for STK push";

  }catch(e){
    status.innerText = "Error occurred";
  }
}

/* ================= UI ================= */
function goBack(){
  step1.classList.remove("hidden");
  loginBox.classList.add("hidden");
  registerBox.classList.add("hidden");
}

</script>

</body>
</html>
