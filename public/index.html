<!DOCTYPE html>
<html>
<head>
<title>JSS Teachers Support Platform</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}
.hero{ padding:30px 20px; }
h1{ color:#22c55e; }

.container{
  max-width:420px;
  margin:auto;
  padding:20px;
}

input, select, button{
  width:100%;
  padding:12px;
  margin:8px 0;
  border:none;
  border-radius:6px;
}

input, select{
  background:#1e293b;
  color:white;
}

button{
  background:#22c55e;
  color:black;
  font-weight:bold;
  cursor:pointer;
}

.hidden{ display:none; }
#status{ color:yellow; margin-top:10px; }
</style>
</head>

<body>

<div class="hero">
  <h1>🚀 JSS Teachers Platform</h1>
  <h2 id="teacherCount">Loading...</h2>
</div>

<div class="container">

  <div id="step1">
    <input id="tsc" placeholder="Enter TSC Number">
    <button onclick="checkTSC()">Continue</button>
  </div>

  <div id="loginBox" class="hidden">
    <input id="loginPassword" type="password" placeholder="Enter Password">
    <button onclick="login()">Login</button>
  </div>

  <div id="registerBox" class="hidden">

    <input id="name" placeholder="Full Name">

    <select id="county" onchange="loadSub()"></select>
    <select id="subcounty"></select>

    <input id="school" placeholder="School">
    <input id="phone" placeholder="Phone">
    <input id="password" type="password" placeholder="Password">

    <button onclick="register()">Register & Pay KSh 50</button>
  </div>

</div>

<script>
/* ================= GLOBAL STATE ================= */
let currentTSC = "";

/* ================= COUNT ================= */
async function loadCount(){
  try {
    const res = await fetch("/count-teachers");
    const data = await res.json();
    document.getElementById("teacherCount").innerText =
      "👩‍🏫 " + (data.total || 0) + " Teachers Registered";
  } catch(e){
    document.getElementById("teacherCount").innerText = "Loading failed";
  }
}
loadCount();
setInterval(loadCount, 10000);

/* ================= COUNTIES ================= */
const counties = {
"Nairobi":["Westlands","Kasarani","Langata"],
"Kiambu":["Thika","Ruiru","Kiambu"],
"Mombasa":["Nyali","Likoni","Mvita"]
};

const countyEl = document.getElementById("county");
countyEl.innerHTML = `<option value="">Select County</option>`;

Object.keys(counties).forEach(c=>{
  countyEl.innerHTML += `<option>${c}</option>`;
});

function loadSub(){
  const c = countyEl.value;
  const sub = document.getElementById("subcounty");
  sub.innerHTML = "";
  (counties[c] || []).forEach(s=>{
    sub.innerHTML += `<option>${s}</option>`;
  });
}

/* ================= CHECK TSC ================= */
async function checkTSC(){
  const tsc = document.getElementById("tsc").value.trim();
  if(!tsc) return alert("Enter TSC");

  currentTSC = tsc;

  const res = await fetch("/check-tsc", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({tsc_no: tsc})
  });

  const data = await res.json();

  document.getElementById("step1").classList.add("hidden");

  if(data.exists){
    document.getElementById("loginBox").classList.remove("hidden");
  }else{
    document.getElementById("registerBox").classList.remove("hidden");
  }
}

/* ================= LOGIN ================= */
async function login(){
  const password = document.getElementById("loginPassword").value;

  const res = await fetch("/login", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      tsc_no: currentTSC,
      password
    })
  });

  const data = await res.json();

  if(data.success){
    localStorage.setItem("teacher", JSON.stringify(data.teacher));
    window.location.href = "/dashboard.html";
  }else{
    alert("Wrong password");
  }
}

/* ================= REGISTER ================= */
async function register(){
  const body = {
    tsc_no: currentTSC,
    name: name.value,
    county: county.value,
    subcounty: subcounty.value,
    school: school.value,
    phone: phone.value,
    password: password.value
  };

  await fetch("/save-teacher-temp", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(body)
  });

  await fetch("/pay", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(body)
  });

  const check = setInterval(async ()=>{
    const res = await fetch("/check-payment/" + currentTSC);
    const d = await res.json();

    if(d.paid){
      clearInterval(check);
      localStorage.setItem("teacher", JSON.stringify(body));
      window.location.href = "/dashboard.html";
    }
  }, 4000);
}
</script>

</body>
</html>
